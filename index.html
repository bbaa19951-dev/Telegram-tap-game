<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <title>Tap to Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body class="bg-darker text-white">
    <div id="root"></div>
    <script>
      // Show full error details
      window.onerror = function(msg, source, line, col, error) {
        var root = document.getElementById('root');
        if (root) {
          var errorMsg = '<div style="color:white;padding:20px;font-size:14px;word-break:break-word;">';
          errorMsg += '<strong>Error:</strong><br>' + msg + '<br>';
          if (error && error.stack) {
            errorMsg += '<pre style="font-size:11px;white-space:pre-wrap;">' + error.stack + '</pre>';
          }
          errorMsg += '<small>Line: ' + line + '</small></div>';
          root.innerHTML = errorMsg;
        }
      };
      // Catch promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="color:white;padding:20px;font-size:14px;"><strong>Unhandled Rejection:</strong><br>' + event.reason + '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
